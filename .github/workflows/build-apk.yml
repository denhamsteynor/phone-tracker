name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.p12"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
              echo "::error::KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD is missing. Add both repository secrets."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$KS"
            PW="$KEYSTORE_PASSWORD"
            echo "Using the signing key from repository secrets."
          else
            echo "::warning::No KEYSTORE_BASE64 secret found, so this APK is signed with a throwaway key. Future builds will not install over it as an update. Run the 'Make signing key' workflow and add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (see README)."
            PW="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt \
              -keystore "$KS" -storetype PKCS12 -storepass "$PW" -keypass "$PW" \
              -alias timeline -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Location Timeline (throwaway)"
          fi
          echo "::add-mask::$PW"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Test and build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace test assembleRelease

      - name: Verify signature
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          echo "Using $BT"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" location-timeline.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-timeline-apk
          path: location-timeline.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Location Timeline build ${{ github.run_number }}
          make_latest: "true"
          files: location-timeline.apk
          body: |
            Download **location-timeline.apk** below on your Android phone and open it to install.
            Built from commit ${{ github.sha }}.
