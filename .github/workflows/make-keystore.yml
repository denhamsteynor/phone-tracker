name: Make signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          set -euo pipefail
          mkdir -p out
          PW="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          echo "::add-mask::$PW"
          keytool -genkeypair -noprompt \
            -keystore release.p12 -storetype PKCS12 -storepass "$PW" -keypass "$PW" \
            -alias timeline -keyalg RSA -keysize 3072 -validity 20000 \
            -dname "CN=Location Timeline"
          base64 -w 0 release.p12 > out/KEYSTORE_BASE64.txt
          printf '%s' "$PW" > out/KEYSTORE_PASSWORD.txt
          rm release.p12

      - name: Upload key files (kept for 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 1
